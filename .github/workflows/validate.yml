name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run all quality gates
        id: validate
        continue-on-error: true
        run: make validate

      - name: Publish validation report
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
        with:
          script: |
            const marker = '<!-- atvos-agent-validation -->';
            const result = process.env.VALIDATION_RESULT;
            const body = `${marker}\n## ${result === 'success' ? '✅ Validación aprobada' : '❌ Validación fallida'}\n\n` +
              `Se ejecutaron formato, lint, tipos, complejidad y pruebas.\n\n` +
              `[Ver detalles de ejecución](${context.payload.pull_request.html_url}/checks)`.replace('/checks', '/checks');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find(comment => comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail when validation fails
        if: steps.validate.outcome != 'success'
        run: exit 1
