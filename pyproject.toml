[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--cov=agents --cov=mcp_server --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]
python_files = ["test_*.py"]
